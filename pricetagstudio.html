<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#0b0b0c"><meta name="description" content="Create clean product graphics in seconds with PriceTag Studio."><title>PriceTag Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="#" aria-label="PriceTag Studio home"><span class="brand-mark">P°</span><span>PriceTag <b>Studio</b></span></a><div class="top-actions"><span class="top-hint">Create. Preview. Export.</span><button id="newDesignBtn" class="ghost-btn" type="button">New design</button></div></header><main class="app-shell"><section class="preview-panel panel"><div class="panel-head"><div><span class="eyebrow">LIVE PREVIEW</span><h1>Your product graphic</h1></div><span id="templateBadge" class="badge">Clean</span></div><div class="canvas-wrap"><canvas id="designCanvas" width="1080" height="1080"></canvas></div><div class="export-row"><button id="downloadBtn" class="primary-btn" type="button">Download PNG</button><button id="shareBtn" class="secondary-btn" type="button">Share</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section><section class="editor-panel panel"><div class="section-heading"><div><span class="eyebrow">EDITOR</span><h2>Product details</h2></div></div><div class="form-grid"><label>Product name<input id="productName" value="Your Product" maxlength="40" placeholder="e.g. Nike Air Max"></label><label>Business name<input id="businessName" value="Your Business Name" maxlength="35" placeholder="Your Business Name"></label><label>Current price<input id="price" value="85000" inputmode="numeric" placeholder="85000"></label><label>Old price <span class="optional">(optional)</span><input id="oldPrice" value="100000" inputmode="numeric" placeholder="100000"></label><label>Currency<select id="currency"><option value="₦">₦ Nigerian Naira</option><option value="$">$ US Dollar</option><option value="£">£ Pound</option><option value="€">€ Euro</option></select></label><label>Contact Details <span class="optional">(optional)</span><input id="contact" value="08000000000" maxlength="40" inputmode="text" placeholder="08000000000"></label></div><div class="control-block"><div class="control-head"><div class="control-label">Product image</div><span id="imageState" class="file-state">Not added</span></div><div class="file-actions"><label class="upload-btn">Upload image<input id="productImage" type="file" accept="image/*" hidden></label><button id="removeImageBtn" class="small-btn" type="button">Remove</button></div></div><div class="control-block"><div class="control-head"><div class="control-label">Logo <span class="optional">(optional)</span></div><span id="logoState" class="file-state">Not added</span></div><div class="file-actions"><label class="upload-btn">Upload logo<input id="logoImage" type="file" accept="image/*" hidden></label><button id="removeLogoBtn" class="small-btn" type="button">Remove</button></div></div><div class="control-block"><div class="control-head"><div class="control-label">Template</div><span class="file-state">5 styles</span></div><div id="templates" class="template-grid"><button class="template-card active" data-template="clean" type="button"><span class="template-preview clean-preview"><i></i></span><span>Clean</span></button><button class="template-card" data-template="sale" type="button"><span class="template-preview sale-preview"><i></i></span><span>Sale</span></button><button class="template-card" data-template="fashion" type="button"><span class="template-preview fashion-preview"><i></i></span><span>Fashion</span></button><button class="template-card" data-template="food" type="button"><span class="template-preview food-preview"><i></i></span><span>Food</span></button><button class="template-card" data-template="business" type="button"><span class="template-preview business-preview"><i></i></span><span>Business</span></button></div></div><div class="control-block"><div class="control-head"><div class="control-label">Accent color</div><span id="colorValue" class="file-state">#111111</span></div><div class="color-row"><button class="color-dot active" data-color="#111111" style="--dot:#111111" aria-label="Black" type="button"></button><button class="color-dot" data-color="#ff3b1f" style="--dot:#ff3b1f" aria-label="Orange red" type="button"></button><button class="color-dot" data-color="#1769ff" style="--dot:#1769ff" aria-label="Blue" type="button"></button><button class="color-dot" data-color="#0f8a5f" style="--dot:#0f8a5f" aria-label="Green" type="button"></button><button class="color-dot" data-color="#8b5cf6" style="--dot:#8b5cf6" aria-label="Purple" type="button"></button><input id="customColor" type="color" value="#111111" title="Custom color" aria-label="Custom accent color"></div></div><button id="saveBtn" class="save-btn" type="button">Save design</button></section></main><section class="saved-section panel"><div class="section-heading"><div><span class="eyebrow">ON THIS DEVICE</span><h2>My designs</h2></div><span id="savedCount" class="file-state">0 saved</span></div><div id="savedDesigns" class="saved-grid"></div></section><footer class="footer"><span>PriceTag Studio</span><span>Designed for fast product graphics.</span></footer><script src="app.js"></script></body></html>
