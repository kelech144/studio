<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page not found</title>

<link rel="icon" href="favicon.jpg">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <style>
  .Not-found{
    text-align: center;
    padding: 150px 0;
  }
    .image-found{
      width:100%;
    }
    .image-found img{
      width:50%;
    }
    .Notfound-image{
      padding: 70px;
    }
    .Notfound-image h1{
      font-family:'Bebas Neue', sans-serif;
      font-size:170px;
      line-height:0.9;
      letter-spacing:2px;
      margin-bottom:15px;
    }

    .Notfound-image h1 .accent{
      color:#FF3B1F;
      display:block;
    }

    .Notfound-image p{
      font-size:23px;
      line-height:1.8;
      color:#b0b0b0;
      margin-bottom:70px;
    }
    @media(max-width:1100px){
      .Notfound-image{
  padding: 50px 27px;
}
      .Notfound-image h1{
        font-size:120px;
      }
    }
    @media(max-width:769px){
      .Not-found{
        padding: 200px 0;
      }
      .Notfound-image h1{
        font-size:78px;
      }
      .Notfound-image p {
        font-size: 18px;
        line-height: 1.7;
        margin-bottom:45px;
      }
    }
    .Not-btn{
      color:black;
      font-size:1rem;
      font-weight:bold;
      background:#fff;
      border:2px solid #fff;
      padding:30px;
      border-radius:120px;
    }
    
  </style>
</head>
<body class="reveal">
  <!-- NAVBAR -->
  <nav>
    <div class="container nav-wrapper">
      <div class="logo"><!--
        <img src="logo.jpg" alt="logo" />-->
        <div class="logo-text">
          KELECH
        </div>
      </div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/service">Services</a>
        <a href="/work">Work</a>
        <a href="/team">Team</a>
        <a href="/contact">Contact</a>
      </div>

      <button class="menu-btn"><i class="ri-menu-3-line"></i></button>

    </div>
  </nav>
  <section class="Not-found">
     <div class="image-found">
        <img src="404.png" alt="404" />
     </div>
     <div class="Notfound-image">
        <h1>
          OOPS! PAGE<span class="accent">NOT FOUND.</span>
        </h1>
        <p>We cannot locate the specific URL you requested for. Please check the address bar for typos.</p>

          <a class="Not-btn" href="/" class="primary-btn">
            Return to Homepage
          </a>
        </div>
  </section>
<script src="main.js"></script>
</body>
  </html>
